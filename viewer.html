<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Remote Desktop Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/connection_stats_panel.css">
    <style>
        body { background: #222; color: #eee; text-align: center; margin: 0; padding: 0; }
        #container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100vw; box-sizing: border-box; padding: 0 2vw; }
        canvas { background: #000; max-width: 100vw; max-height: 80vh; width: 100%; height: auto; box-shadow: 0 0 16px #000a; border-radius: 12px; }
        #controls { margin-bottom: 10px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; }
        label { margin-right: 8px; font-size: 1em; }
        input[type=range] { width: 100px; touch-action: pan-x; }
        button { padding: 8px 20px; border-radius: 8px; border: none; background: #2d8cf0; color: #fff; font-size: 1em; cursor: pointer; transition: background 0.2s; }
        button:hover, button:focus { background: #1a6dc2; }
        @media (max-width: 600px) {
            #container { padding: 0 1vw; }
            h1 { font-size: 1.1em; }
            #controls { flex-direction: column; gap: 6px; }
            label, #fpsValue { font-size: 0.95em; }
            input[type=range] { width: 80vw; max-width: 200px; }
            button { width: 100%; font-size: 1em; }
            canvas { max-width: 98vw; max-height: 50vh; }
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>Remote Desktop Live Viewer (PNG - Lossless)</h1>
        <div id="controls">
            <label for="fps">FPS:</label>
            <input type="range" id="fps" min="1" max="30" value="10">
            <span id="fpsValue">10</span>
            <button id="apply">Apply</button>
        </div>
        <canvas id="screen"></canvas>
    </div>
    <!-- Removed all references to audio_controls.js, resolution_controls.js, connection_status.js, and hotkeys.js (with and without /static/) to prevent 404 errors -->
</body>
</html>
