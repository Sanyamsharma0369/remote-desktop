<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard — Remote Desktop</title>
    <meta name="description" content="View and manage all your remote devices from a single dashboard.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b14">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-primary: #0a0e1a;
            --bg-card: rgba(15, 20, 40, 0.55);
            --bg-card-hover: rgba(20, 28, 55, 0.7);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(59, 130, 246, 0.25);
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-amber: #f59e0b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --shadow-glow: 0 0 60px rgba(59, 130, 246, 0.1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            position: relative;
        }

        .bg-gradient {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 60% 80%, rgba(6, 182, 212, 0.06) 0%, transparent 50%);
            animation: gradientShift 15s ease-in-out infinite alternate;
            z-index: 0;
        }

        @keyframes gradientShift {
            0% { transform: scale(1); }
            100% { transform: scale(1.05) rotate(1deg); }
        }

        .bg-grid {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 64px;
            background: rgba(10, 14, 26, 0.8);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
        }

        .logo-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 16px;
            color: #fff;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
            transition: transform 0.3s ease;
        }

        .logo:hover .logo-icon {
            transform: scale(1.08) rotate(-3deg);
        }

        .logo-text {
            font-size: 1.3em;
            font-weight: 700;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 16px 6px 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-glass);
            border-radius: 50px;
            font-size: 0.9em;
            color: var(--text-secondary);
        }

        .user-avatar {
            width: 28px; height: 28px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }

        .logout-btn {
            padding: 8px 20px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 10px;
            color: #fca5a5;
            font-size: 0.88em;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.4);
            color: #fecaca;
            transform: translateY(-1px);
        }

        /* Main content */
        .main {
            position: relative;
            z-index: 1;
            padding: 96px 32px 48px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-header {
            margin-bottom: 40px;
            animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .page-header h1 {
            font-size: 2em;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .page-header p {
            color: var(--text-secondary);
            font-size: 1em;
        }

        /* Stats bar */
        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 36px;
            flex-wrap: wrap;
            animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.1s;
            opacity: 0;
        }

        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 20px 28px;
            flex: 1;
            min-width: 180px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stat-icon {
            width: 44px; height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-icon svg {
            width: 22px; height: 22px;
        }

        .stat-info .stat-number {
            font-size: 1.5em;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-info .stat-label {
            font-size: 0.82em;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Devices */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.2s;
            opacity: 0;
        }

        .section-header h2 {
            font-size: 1.3em;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .devices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.3s;
            opacity: 0;
        }

        .device-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 28px;
            transition: all 0.35s ease;
            cursor: default;
            position: relative;
            overflow: hidden;
        }

        .device-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 3px;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .device-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(59,130,246,0.08);
        }

        .device-card:hover::before {
            opacity: 1;
        }

        .device-card.offline {
            opacity: 0.6;
        }

        .device-card.offline:hover {
            opacity: 0.75;
            transform: translateY(-2px);
        }

        .device-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .device-icon {
            width: 48px; height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(59,130,246,0.1);
            border: 1px solid rgba(59,130,246,0.1);
        }

        .device-icon svg {
            width: 24px; height: 24px;
            stroke: var(--accent-blue);
        }

        .device-icon.mac svg { stroke: var(--accent-purple); }
        .device-icon.mac { background: rgba(139,92,246,0.1); border-color: rgba(139,92,246,0.1); }
        .device-icon.linux svg { stroke: var(--accent-amber); }
        .device-icon.linux { background: rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.1); }
        .device-icon.self svg { stroke: var(--accent-green); }
        .device-icon.self { background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.1); }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.78em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-badge.online {
            background: rgba(16, 185, 129, 0.1);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-badge.offline {
            background: rgba(239, 68, 68, 0.08);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.15);
        }

        .status-badge .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
        }

        .status-badge.online .dot {
            background: #10b981;
            box-shadow: 0 0 6px rgba(16, 185, 129, 0.5);
            animation: pulse-dot 2s ease-in-out infinite;
        }

        .status-badge.offline .dot {
            background: #ef4444;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .device-name {
            font-size: 1.15em;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .device-os {
            font-size: 0.88em;
            color: var(--text-muted);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .device-actions {
            display: flex;
            gap: 10px;
        }

        .connect-btn {
            flex: 1;
            padding: 11px 20px;
            border-radius: 12px;
            font-size: 0.9em;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .connect-btn.primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        .connect-btn.primary::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.5s ease;
        }

        .connect-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(59, 130, 246, 0.35);
        }

        .connect-btn.primary:hover::before { left: 100%; }

        .connect-btn.disabled {
            background: rgba(255,255,255,0.04);
            color: var(--text-muted);
            cursor: not-allowed;
            border: 1px solid var(--border-glass);
        }

        .connect-btn svg {
            width: 18px; height: 18px;
        }

        /* Power dropdown */
        .power-dropdown {
            position: relative;
        }

        .power-btn {
            height: 100%;
            padding: 0 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .power-btn:hover {
            background: rgba(255,255,255,0.1);
            color: var(--text-primary);
        }

        .power-menu {
            position: absolute;
            bottom: calc(100% + 8px);
            right: 0;
            background: rgba(12, 16, 30, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 6px;
            min-width: 160px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 50;
        }

        .power-dropdown.open .power-menu {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .power-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
            color: var(--text-secondary);
            font-size: 0.9em;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .power-item:hover {
            background: rgba(255,255,255,0.05);
            color: var(--text-primary);
        }

        .power-item.danger:hover {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent-red);
        }

        .power-item svg { width: 16px; height: 16px; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Loading skeleton */
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.04), rgba(255,255,255,0.08), rgba(255,255,255,0.04));
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @media (max-width: 768px) {
            .main { padding: 88px 16px 32px; }
            .navbar { padding: 0 16px; }
            .devices-grid { grid-template-columns: 1fr; }
            .stats-bar { flex-direction: column; }
            .user-badge { display: none; }
        }
    </style>
</head>
<body>

<div class="bg-gradient"></div>
<div class="bg-grid"></div>

<nav class="navbar">
    <a href="/" class="logo">
        <div class="logo-icon">RD</div>
        <span class="logo-text">Remote Desktop</span>
    </a>
    <div class="nav-right">
        <div class="user-badge" id="userBadge">
            <div class="user-avatar" id="userAvatar">?</div>
            <span id="userName">Loading...</span>
        </div>
        <button class="logout-btn" id="logoutBtn">
            <span>Sign Out</span>
        </button>
    </div>
</nav>

<main class="main">
    <div class="page-header">
        <h1>My Devices</h1>
        <p>Manage and connect to your remote machines</p>
    </div>

    <div class="stats-bar" id="statsBar">
        <div class="stat-card">
            <div class="stat-icon" style="background: rgba(16,185,129,0.1);">
                <svg viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                    <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
            </div>
            <div class="stat-info">
                <div class="stat-number" id="onlineCount">0</div>
                <div class="stat-label">Online</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon" style="background: rgba(239,68,68,0.08);">
                <svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
                </svg>
            </div>
            <div class="stat-info">
                <div class="stat-number" id="offlineCount">0</div>
                <div class="stat-label">Offline</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon" style="background: rgba(59,130,246,0.1);">
                <svg viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                    <line x1="8" y1="21" x2="16" y2="21"/>
                    <line x1="12" y1="17" x2="12" y2="21"/>
                </svg>
            </div>
            <div class="stat-info">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">Total Devices</div>
            </div>
        </div>
    </div>

    <div class="section-header">
        <h2>All Devices</h2>
    </div>

    <div class="devices-grid" id="devicesGrid">
        <!-- Devices populated by JS -->
    </div>
</main>

<script>
// Auth guard
if (!localStorage.getItem('token')) {
    window.location.href = '/login';
}

// Logout
document.getElementById('logoutBtn').onclick = function() {
    localStorage.removeItem('token');
    window.location.href = '/login';
};

function getDeviceIconClass(type, os = '') {
    const osLower = os.toLowerCase();
    if (type === 'mac' || osLower.includes('mac') || osLower.includes('darwin')) return 'mac';
    if (type === 'linux' || osLower.includes('linux') || osLower.includes('ubuntu')) return 'linux';
    if (type === 'self') return 'self';
    return '';
}

function getDeviceSVG(type, os = '') {
    const osLower = os.toLowerCase();
    if (type === 'mac' || osLower.includes('mac') || osLower.includes('darwin')) {
        return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>`;
    }
    if (type === 'linux' || osLower.includes('linux') || osLower.includes('ubuntu')) {
        return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/></svg>`;
    }
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>`;
}

function renderDevices(devices) {
    const grid = document.getElementById('devicesGrid');
    grid.innerHTML = '';

    if (!devices || devices.length === 0) {
        grid.innerHTML = `
            <div style="grid-column: 1 / -1; text-align: center; padding: 48px; background: var(--bg-card); border-radius: 20px; border: 1px solid var(--border-glass);">
                <p style="color: var(--text-secondary); font-size: 1.1em;">No devices connected</p>
            </div>
        `;
        document.getElementById('onlineCount').textContent = '0';
        document.getElementById('offlineCount').textContent = '0';
        document.getElementById('totalCount').textContent = '0';
        return;
    }

    let onlineCount = 0;
    let offlineCount = 0;

    devices.forEach((device, index) => {
        const isOnline = device.status === 'online';
        if (isOnline) onlineCount++;
        else offlineCount++;

        const card = document.createElement('div');
        card.className = `device-card ${isOnline ? '' : 'offline'}`;
        card.style.animationDelay = `${0.3 + index * 0.05}s`;

        const isSelf = device.type === 'self' || !device.type;
        const iconClass = getDeviceIconClass(device.type, device.os || '');
        const iconSVG = getDeviceSVG(device.type, device.os || '');
        const connectHref = '/viewer';
        const connectLabel = isSelf ? 'Open Viewer' : 'Connect';

        card.innerHTML = `
            <div class="device-top">
                <div class="device-icon ${iconClass}">
                    ${iconSVG}
                </div>
                <span class="status-badge ${isOnline ? 'online' : 'offline'}">
                    <span class="dot"></span>
                    ${isOnline ? 'Online' : 'Offline'}
                </span>
            </div>
            <div class="device-name">${device.name || 'This Device'}${isSelf ? ' <span style="color:var(--accent-green);font-size:0.75em;font-weight:500;">(This PC)</span>' : ''}</div>
            <div class="device-os">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                ${device.os || 'Unknown OS'}${device.hostname ? ' · ' + device.hostname : ''}
            </div>
            <div class="device-actions">
                ${isOnline
                    ? `<button class="connect-btn primary" onclick="window.location.href='${connectHref}'">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        ${connectLabel}
                      </button>
                      <div class="power-dropdown" onclick="event.stopPropagation()">
                          <button class="icon-btn" style="background: var(--bg-surface);" onclick="this.parentElement.classList.toggle('open')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
                          <div class="power-menu">
                              <button class="power-item" onclick="confirmPowerAction('lock')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Lock</button>
                              <button class="power-item" onclick="confirmPowerAction('sleep')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg> Sleep</button>
                              <div class="power-divider"></div>
                              <button class="power-item" onclick="confirmPowerAction('restart')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> Restart</button>
                              <button class="power-item danger" onclick="confirmPowerAction('shutdown')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg> Shut Down</button>
                          </div>
                      </div>`
                    : `<button class="connect-btn disabled" disabled>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
                        Unavailable
                      </button>`
                }
            </div>
        `;
        grid.appendChild(card);
    });

    document.getElementById('onlineCount').textContent = onlineCount;
    document.getElementById('offlineCount').textContent = offlineCount;
    document.getElementById('totalCount').textContent = devices.length;
}

// Close dropdowns on outside click
document.addEventListener('click', e => {
    if (!e.target.closest('.power-dropdown')) {
        document.querySelectorAll('.power-dropdown.open').forEach(el => el.classList.remove('open'));
    }
});

async function canReachRemoteDevice() {
    try {
        const res = await fetch('/api/my_device', {
            headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
        });
        return res.ok;
    } catch {
        return false;
    }
}

async function confirmPowerAction(action) {
    const isReachable = await canReachRemoteDevice();
    if (!isReachable) {
        alert(`Cannot reach remote device to perform ${action}.`);
        return;
    }

    const destructive = new Set(["sleep", "restart", "shutdown"]);
    
    if (destructive.has(action)) {
        const confirmed = window.confirm(
            `${action.toUpperCase()} the remote PC?\n\n` +
            "Your current remote connection will be interrupted."
        );
        if (!confirmed) return;
    }
    
    try {
        const res = await fetch(`/api/power/${action}`, {
            method: 'POST',
            credentials: 'include',
            headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
        });
        if (res.ok) alert(`${action} command sent successfully`);
        else alert(`Failed to send ${action} command`);
    } catch (e) {
        alert('Error: ' + e.message);
    }
}

// Fetch current real device only
fetch('/api/my_device', {
    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
})
.then(res => {
    if (res.status === 401) {
        localStorage.removeItem('token');
        window.location.href = '/login?expired=true';
        return;
    }
    return res.json();
})
.then(device => {
    if (!device) {
        renderDevices([]);
        return;
    }
    const realDevices = [
        { name: device.name || 'This Device', os: device.os, status: 'online', type: 'self', hostname: device.hostname }
    ];
    renderDevices(realDevices);

    // Update user badge
    const token = localStorage.getItem('token');
    if (token) {
        try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            const username = payload.sub || 'User';
            document.getElementById('userName').textContent = username;
            document.getElementById('userAvatar').textContent = username.charAt(0).toUpperCase();
        } catch(e) {
            document.getElementById('userName').textContent = 'User';
            document.getElementById('userAvatar').textContent = 'U';
        }
    }
})
.catch(() => {
    renderDevices([]);
});
</script>
</body>
